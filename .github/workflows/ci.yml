name: ForkTactics checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression tests
        id: tests
        run: npm test
      # Diagnose build failures independently; a failed test must not hide
      # whether the app also fails to compile. The job still fails if tests fail.
      - name: Build production app
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run build
