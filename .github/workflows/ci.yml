name: Verify Forktactics

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Require reproducible dependency lockfile
        run: |
          if [ ! -f package.json ] || [ ! -f package-lock.json ]; then
            echo '::error::Forktactics source and package-lock.json must be imported before CI can pass.'
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify isolated domain logic
        run: npm run test:domain
      - name: Typecheck application
        run: npm run typecheck
      - name: Lint application
        run: npm run lint
      - name: Run Vitest
        run: npm test
      - name: Build production bundle
        run: npm run build
